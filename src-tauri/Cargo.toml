[package]
name = "caa-app"
description = "Editor CAA in simboli (app Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
caa-engine = { path = "../crates/caa-engine" }
caa-store = { path = "../crates/caa-store" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
