[package]
name = "caa-engine"
description = "Motore di simbolizzazione: testo italiano -> token annotati (libreria pura, nessun I/O)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Solo logica pura (nessun I/O, nessuna rete): il motore resta compilabile anche in WebAssembly.
[dependencies]
fst = { version = "0.4", features = ["levenshtein"] }
unicode-normalization = "0.1"
