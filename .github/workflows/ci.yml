name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux — formato, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Librerie di sistema per Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npm install
      - run: npm run build

  windows:
    name: Windows — test, build, app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: cargo test --workspace
      - run: npm install
      - run: npm run build
      - name: Compila l'app (senza installer)
        run: npx tauri build --no-bundle
      - name: Pubblica l'app per la prova manuale
        uses: actions/upload-artifact@v4
        with:
          name: editor-caa-windows
          path: target/release/caa-app.exe
          if-no-files-found: error
