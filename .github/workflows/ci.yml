name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux — formato, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Librerie di sistema per Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Il motore deve restare compilabile in WebAssembly (SPEC.md, "Regole architetturali").
      - run: cargo check -p caa-engine --target wasm32-unknown-unknown
      - run: npm install
      - run: npm run build

  editor:
    name: Editor — prove automatiche (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Browser per le prove
        run: npx playwright install --with-deps chromium
      # pdftotext, pdftoppm, pdfinfo: le prove di stampa (M10) e del foglio congelato (M11-0) leggono i PDF.
      - name: Strumenti per leggere i PDF
        run: sudo apt-get install -y poppler-utils
      # Le prove di velocità (@perf) dipendono dalla macchina: si eseguono a mano.
      - run: npx playwright test --grep-invert @perf

  windows:
    name: Windows — test, build, app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: cargo test --workspace
      - run: npm install
      - run: npm run build
      - name: Compila l'app (senza installer)
        run: npx tauri build --no-bundle
      - name: Pubblica l'app per la prova manuale
        uses: actions/upload-artifact@v5
        with:
          name: editor-caa-windows
          path: target/release/caa-app.exe
          if-no-files-found: error
